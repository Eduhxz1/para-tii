<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Trebuchet MS", Arial, sans-serif;

        background:
            radial-gradient(circle at 50% 45%,
                rgba(255, 220, 240, 0.95) 0%,
                rgba(245, 190, 225, 0.7) 25%,
                transparent 55%),
            radial-gradient(circle at 15% 20%,
                rgba(220, 190, 255, 0.8),
                transparent 35%),
            radial-gradient(circle at 85% 80%,
                rgba(255, 200, 225, 0.8),
                transparent 35%),
            linear-gradient(
                135deg,
                #cdb9ed 0%,
                #f0b8d9 45%,
                #e5c5ed 100%
            );
    }

    .nubes {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .nube {
        position: absolute;
        width: 350px;
        height: 110px;
        background: rgba(255, 235, 248, 0.30);
        border-radius: 50%;
        filter: blur(25px);
    }

    .nube::before,
    .nube::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
    }

    .nube::before {
        width: 180px;
        height: 130px;
        left: 60px;
        top: -55px;
    }

    .nube::after {
        width: 150px;
        height: 120px;
        right: 50px;
        top: -40px;
    }

    .nube:nth-child(1) {
        top: 12%;
        left: -100px;
        transform: scale(1.3);
    }

    .nube:nth-child(2) {
        top: 30%;
        right: -130px;
        transform: scale(1.5);
    }

    .nube:nth-child(3) {
        bottom: 8%;
        left: 10%;
        transform: scale(1.2);
    }

    .nube:nth-child(4) {
        bottom: 18%;
        right: 5%;
        transform: scale(1.4);
    }

    .brillos {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .brillo {
        position: absolute;
        color: white;
        font-size: 22px;
        opacity: 0.8;
        animation: brillo 3s ease-in-out infinite;
    }

    .brillo:nth-child(1) {
        top: 12%;
        left: 15%;
    }

    .brillo:nth-child(2) {
        top: 20%;
        right: 20%;
        animation-delay: .8s;
    }

    .brillo:nth-child(3) {
        top: 55%;
        left: 8%;
        animation-delay: 1.5s;
    }

    .brillo:nth-child(4) {
        bottom: 15%;
        right: 18%;
        animation-delay: 2s;
    }

    .brillo:nth-child(5) {
        bottom: 30%;
        left: 30%;
        animation-delay: .5s;
    }

    @keyframes brillo {
        0%, 100% {
            opacity: .25;
            transform: scale(.8);
        }

        50% {
            opacity: 1;
            transform: scale(1.3);
        }
    }

    .corazones {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .corazon {
        position: absolute;
        bottom: -80px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 30px;
        filter: drop-shadow(0 0 8px rgba(255,255,255,.6));
        animation: flotar linear infinite;
    }

    .corazon:nth-child(1) {
        left: 8%;
        font-size: 28px;
        animation-duration: 9s;
    }

    .corazon:nth-child(2) {
        left: 20%;
        font-size: 18px;
        animation-duration: 12s;
        animation-delay: 2s;
    }

    .corazon:nth-child(3) {
        left: 35%;
        font-size: 35px;
        animation-duration: 10s;
        animation-delay: 4s;
    }

    .corazon:nth-child(4) {
        left: 50%;
        font-size: 20px;
        animation-duration: 13s;
        animation-delay: 1s;
    }

    .corazon:nth-child(5) {
        left: 65%;
        font-size: 32px;
        animation-duration: 11s;
        animation-delay: 3s;
    }

    .corazon:nth-child(6) {
        left: 78%;
        font-size: 22px;
        animation-duration: 9s;
        animation-delay: 5s;
    }

    .corazon:nth-child(7) {
        left: 90%;
        font-size: 38px;
        animation-duration: 14s;
        animation-delay: 2s;
    }

    @keyframes flotar {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }

        10% {
            opacity: .8;
        }

        50% {
            transform: translateY(-50vh) translateX(30px) rotate(15deg);
        }

        100% {
            transform: translateY(-115vh) translateX(-40px) rotate(-15deg);
            opacity: 0;
        }
    }

    .contenedor {
        position: relative;
        z-index: 10;
        width: min(90%, 720px);
        padding: 55px 45px;
        text-align: center;

        background: rgba(255, 240, 250, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 35px;

        box-shadow:
            0 25px 70px rgba(90, 50, 100, .18),
            inset 0 0 40px rgba(255,255,255,.15);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .mensaje {
        color: #28202c;
        font-size: clamp(20px, 3vw, 28px);
        line-height: 1.55;
        font-weight: 500;
        text-shadow: 0 1px 10px rgba(255,255,255,.5);
        margin-bottom: 35px;
    }

    .spotify {
        display: inline-flex;
        align-items: center;
        gap: 12px;

        padding: 15px 30px;

        background: #1DB954;
        color: white;

        text-decoration: none;
        border-radius: 50px;

        font-size: 17px;
        font-weight: bold;

        box-shadow:
            0 10px 25px rgba(29,185,84,.30);

        transition:
            transform .25s ease,
            box-shadow .25s ease;
    }

    .spotify:hover {
        transform: translateY(-5px) scale(1.04);

        box-shadow:
            0 15px 35px rgba(29,185,84,.45);
    }

    .spotify span {
        font-size: 24px;
    }

    @media (max-width: 600px) {
        .contenedor {
            padding: 40px 25px;
        }

        .mensaje {
            font-size: 20px;
        }

        .spotify {
            font-size: 15px;
            padding: 13px 23px;
        }
    }
</style>
